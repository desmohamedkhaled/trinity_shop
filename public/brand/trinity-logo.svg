<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f26122"/>
      <stop offset="1" stop-color="#a44a16"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffc87a"/>
      <stop offset="1" stop-color="#b84835"/>
    </linearGradient>
    <linearGradient id="text" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4166"/>
      <stop offset="1" stop-color="#1d78c8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" fill="#fffaf3"/>

  <!-- left overlapping circular icon -->
  <g transform="translate(28,20)">
    <circle cx="70" cy="120" r="118" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <circle cx="92" cy="120" r="86" fill="none" stroke="#fffaf3" stroke-width="2"/>
    <circle cx="110" cy="120" r="86" fill="none" stroke="#d8b291" stroke-width="10" opacity="0.9"/>
  </g>

  <!-- right overlapping circles -->
  <g transform="translate(145,15)">
    <circle cx="120" cy="140" r="112" fill="none" stroke="url(#mark)" stroke-width="8"/>
    <circle cx="150" cy="120" r="85" fill="none" stroke="#ffd7b4" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- center white background area for icon and lettering -->
  <circle cx="190" cy="150" r="120" fill="#fffaf3" stroke="#e0d4bd" stroke-width="2"/>

  <!-- decorative cross/marks -->
  <g transform="translate(180,105) scale(1.25)">
    <path d="M0 0 L80 80" fill="none" stroke="#b84835" stroke-width="10" stroke-linecap="round"/>
    <path d="M85 0 L0 80" fill="none" stroke="#e27717" stroke-width="10" stroke-linecap="round"/>
    <path d="M96 70 L150 0" fill="none" stroke="#0b4166" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="196" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="800" letter-spacing="10" fill="url(#text)">
    TRINITY
  </text>

  <!-- tagline -->
  <text x="430" y="260" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#b84835">
    CHRISTIAN GIFT SHOP
  </text>
</svg>
